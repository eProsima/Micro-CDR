name: CI Linux

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      name:
        description: "Manual trigger"
  schedule:
    - cron: '35 17 * * 6'

permissions:
  checks: write

jobs:
  build-test-style-cover:
    name: Build, Tests, and Coverage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install CMake and prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3-pip git uncrustify valgrind
          python3 -m pip install --upgrade pip
          python3 -m pip install gcovr

          # CMake 3.31.8
          CMAKE_VER=3.31.8
          curl -L "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" -o cmake-old.tgz
          sudo tar -C /opt -xzf cmake-old.tgz
          echo "/opt/cmake-${CMAKE_VER}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Show cmake version
        run: |
          cmake --version
          ctest --version

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake ../ci/linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j"$(nproc)"

      # --- Run tests with newer CTest to produce JUnit ---
      - name: Run tests and export JUnit
        shell: bash
        run: |
          ctest --test-dir build/microcdr-build \
            --output-on-failure \
            --no-tests=error \
            --output-junit "$GITHUB_WORKSPACE/build/CTestResults.xml"

      - name: Generate coverage (gcovr Cobertura XML + HTML)
        shell: bash
        run: |
          EXCLUDES=(
            '--exclude-unreachable-branches'
            '--exclude' 'ci/'
            '--exclude' 'test/'
            '--exclude' 'build/'
          )
          gcovr -x -r . "${EXCLUDES[@]}" -o build/coverage.xml
          gcovr --html-details -r . "${EXCLUDES[@]}" -o build/coverage.html

      - name: Uncrustify check
        shell: bash
        run: |
          curl -L https://raw.githubusercontent.com/eProsima/cpp-style/master/uncrustify.cfg -o uncrustify.cfg
          set +e
          find src test include examples \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" \) \
            -exec uncrustify -c uncrustify.cfg --check {} +
          UNCR_EXIT=$?
          set -e
          if [ $UNCR_EXIT -ne 0 ]; then
            echo "Code style violations found by uncrustify."
            exit $UNCR_EXIT
          fi

      - name: Upload artifacts (CTest & Coverage)
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            build/CTestResults.xml
            build/coverage.xml
            build/coverage.html
          if-no-files-found: warn

      - name: Publish unit test results (JUnit)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files: build/CTestResults.xml
          check_name: "Linux Tests"
          comment_mode: off

      - name: Coverage (human-readable summary)
        if: success()
        shell: bash
        run: |
          gcovr -r . \
            --exclude-unreachable-branches \
            --exclude ci/ \
            --exclude test/ \
            --exclude build/
