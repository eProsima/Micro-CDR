name: CI Linux

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      name:
        description: "Manual trigger"

jobs:
  build-test-style-cover:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- CMake 3.15.7 (same as Jenkins) ---
      - name: Install CMake 3.15.7 and prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3-pip git uncrustify valgrind
          python3 -m pip install --upgrade pip
          python3 -m pip install gcovr

          CMAKE_VERSION=3.15.7
          curl -L "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-Linux-x86_64.tar.gz" -o cmake.tgz
          sudo tar -C /opt -xzf cmake.tgz
          echo "/opt/cmake-${CMAKE_VERSION}-Linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Show cmake version
        run: cmake --version

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake ../ci/linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j"$(nproc)"

      - name: Collect CTest results
        shell: bash
        run: |
          set -e
          if [ -f "build/microcdr-build/Testing/TAG" ]; then
            TEST_TAG="$(head -n 1 "build/microcdr-build/Testing/TAG" || echo "")"
            if [ -n "$TEST_TAG" ] && [ -f "build/microcdr-build/Testing/$TEST_TAG/Test.xml" ]; then
              cp "build/microcdr-build/Testing/$TEST_TAG/Test.xml" "build/CTestResults.xml"
            fi
          fi
          if [ ! -f "build/CTestResults.xml" ]; then
            echo '<testsuite name="ctest" tests="0" failures="0" errors="0"></testsuite>' > build/CTestResults.xml
          fi

      - name: Generate coverage (gcovr Cobertura XML)
        shell: bash
        run: |
          gcovr -x -r . \
            --exclude-unreachable-branches \
            --exclude ci/ \
            --exclude test/ \
            --exclude build/ \
            -o build/coverage.xml

      - name: Uncrustify check
        shell: bash
        run: |
          curl -L https://raw.githubusercontent.com/eProsima/cpp-style/master/uncrustify.cfg -o uncrustify.cfg
          set +e
          find src test include examples \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" \) \
            -exec uncrustify -c uncrustify.cfg --check {} +
          UNCR_EXIT=$?
          set -e
          if [ $UNCR_EXIT -ne 0 ]; then
            echo "Code style violations found by uncrustify."
            exit $UNCR_EXIT
          fi

      # --- Publish reports in the PR ---
      - name: Upload artifacts (CTest & Coverage)
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            build/CTestResults.xml
            build/coverage.xml
          if-no-files-found: warn

      - name: Publish unit test results (JUnit)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/CTestResults.xml

      - name: Coverage (human-readable summary)
        if: always()
        shell: bash
        run: |
          gcovr -r . \
            --exclude-unreachable-branches \
            --exclude ci/ \
            --exclude test/ \
            --exclude build/
