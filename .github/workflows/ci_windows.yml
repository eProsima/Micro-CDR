name: CI Windows

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      name:
        description: "Manual trigger"

jobs:
  build-test-style-cover:
    name: Build and Tests
    runs-on: windows-2022

    env:
      TOOLSET: v143

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show tool versions
        shell: pwsh
        run: |
          cmake --version
          ctest --version

      - name: Configure
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake ..\ci\windows `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -T $env:TOOLSET `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cd build
          cmake --build . --config Release

      # Run tests and export JUnit
      - name: Run tests and export JUnit
        shell: pwsh
        run: |
          ctest --test-dir build\microcdr-build `
            -C Release `
            --output-on-failure `
            --no-tests=error `
            --output-junit "$env:GITHUB_WORKSPACE\build\CTestResults.xml"
          Get-Item "$env:GITHUB_WORKSPACE\build\CTestResults.xml" | Format-List -Property *

      - name: Upload artifacts (CTest)
        uses: actions/upload-artifact@v4
        with:
          name: test
          path: |
            build/CTestResults.xml
          if-no-files-found: warn

      - name: Publish unit test results (JUnit)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/CTestResults.xml
